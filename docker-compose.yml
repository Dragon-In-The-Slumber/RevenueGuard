services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/revenueguard
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-auto}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_MODEL=${GOOGLE_MODEL:-gemini-3.5-flash-lite}
      # Throughput knobs. Defaults suit a free-tier key (5 requests/minute);
      # raise TICK_CONCURRENCY and set DEMO_FAST=false on a paid key.
      - TICK_CONCURRENCY=${TICK_CONCURRENCY:-3}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-4}
      - DEMO_FAST=${DEMO_FAST:-true}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
      - ./chroma_data:/app/chroma_data
      # ChromaDB downloads a 79MB ONNX embedding model on first use. Without a
      # volume it lands in the container layer and is re-downloaded on every
      # rebuild — and a timed-out download fails application startup outright.
      - chroma_models:/home/appuser/.cache/chroma

  # `docker compose up` used to start a backend and no UI at all.
  dashboard:
    build:
      context: ./dashboard
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    ports:
      - "3000:3000"
    environment:
      # Server-side rewrite target, so /api/* works even when the build-time
      # public URL is wrong.
      - API_PROXY_TARGET=http://api:8000
    depends_on:
      - api

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=revenueguard
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d revenueguard" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  chroma_models:
