databases:
  - name: revenueguard-db
    databaseName: revenueguard
    plan: free

services:
  - type: redis
    name: revenueguard-redis
    plan: free
    ipAllowList: []

  - type: web
    name: revenueguard-api
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: revenueguard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: revenueguard-redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  - type: web
    name: revenueguard-dashboard
    env: node
    rootDir: dashboard
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        # We set sync to false because this needs to be the full URL (e.g., https://revenueguard-api.onrender.com)
        # of your newly created API service. You'll need to set this manually in the Render dashboard
        # once the API service is created.
        sync: false
